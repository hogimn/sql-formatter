name: Deploy SQL Formatter demo

on:
  push:
    branches: [main]
    paths:
      - 'SQL.Formatter/**'
      - 'SQL.Formatter.Demo/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish demo
        run: dotnet publish SQL.Formatter.Demo/SQL.Formatter.Demo.csproj --configuration Release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: SQL.Formatter.Demo/bin/Release/net10.0/publish/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
